name: Deploy to itch.io

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ITCH_USERNAME: ${{ secrets.ITCH_USERNAME }}
      ITCH_GAME: ${{ secrets.ITCH_GAME }}
      ITCH_CHANNEL: ${{ vars.ITCH_CHANNEL || 'web' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config
        run: |
          test -n "$ITCH_USERNAME" || (echo "Missing secret: ITCH_USERNAME" && exit 1)
          test -n "$ITCH_GAME" || (echo "Missing secret: ITCH_GAME" && exit 1)
          test -n "${{ secrets.ITCH_API_KEY }}" || (echo "Missing secret: ITCH_API_KEY" && exit 1)

      - name: Prepare upload directory
        run: ./scripts/prepare-itch-build.sh

      - name: Install Butler
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -oq butler.zip
          chmod +x butler

      - name: Push with Butler
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          ./butler push ./.itch-build "$ITCH_USERNAME/$ITCH_GAME:$ITCH_CHANNEL"
